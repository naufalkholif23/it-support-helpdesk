<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Suryanesia Helpdesk</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex min-h-screen items-center justify-center bg-slate-100 p-6 text-slate-800">
    <main class="w-full max-w-md rounded-3xl border border-gray-200 bg-white p-8 shadow-xl">
        <div class="mb-7 text-center">
            <img src="logo-green.png" alt="Suryanesia Logo" class="mx-auto h-12 object-contain">
            <h1 class="mt-4 text-2xl font-extrabold text-gray-900">Admin Dashboard</h1>
            <p class="mt-2 text-sm text-gray-500">Admin authentication is required.</p>
        </div>
        <form id="admin-login-form" class="space-y-4">
            <label class="block text-sm font-bold text-gray-700">Admin email
                <input id="admin-email" type="email" required class="mt-2 w-full rounded-xl border border-gray-200 bg-gray-50 px-4 py-3 outline-none focus:border-green-700" placeholder="admin@suryanesia.test">
            </label>
            <label class="block text-sm font-bold text-gray-700">Password
                <input id="admin-password" type="password" required class="mt-2 w-full rounded-xl border border-gray-200 bg-gray-50 px-4 py-3 outline-none focus:border-green-700" placeholder="admin123">
            </label>
            <p id="admin-login-error" class="hidden rounded-xl border border-red-200 bg-red-50 p-3 text-sm text-red-700"></p>
            <button class="w-full rounded-xl bg-[#00783d] px-4 py-3 font-bold text-white hover:bg-green-800" type="submit">Login as Admin</button>
        </form>
        <p class="mt-5 text-center text-xs text-gray-500"><a class="font-bold text-[#00783d]" href="index.html">Back to Public Helpdesk</a></p>
        <p class="mt-5 text-center text-[10px] font-bold uppercase tracking-widest text-gray-400">Prototype authentication only</p>
    </main>
    <script>
        // DEMO AUTHENTICATION ONLY. Production should use a secure backend/session.
        document.getElementById('admin-login-form').addEventListener('submit', function (event) {
            event.preventDefault();
            const email = document.getElementById('admin-email').value.trim().toLowerCase();
            const password = document.getElementById('admin-password').value;
            const error = document.getElementById('admin-login-error');
            if (email !== 'admin@suryanesia.test' || password !== 'admin123') {
                error.textContent = 'Invalid admin credentials.';
                error.classList.remove('hidden');
                return;
            }
            sessionStorage.setItem('currentUser', JSON.stringify({
                id: 'ADM001', name: 'Admin Demo', email, role: 'admin', department: 'IT Support'
            }));
            window.location.href = 'admin.html';
        });
    </script>
</body>
</html>
