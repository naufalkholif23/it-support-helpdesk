    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f8fafc;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent; 
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }

        /* Animations */
        .fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Accordion Styles */
        .accordion-content {
            transition: max-height 0.3s ease-in-out, opacity 0.3s ease-in-out, padding 0.3s ease-in-out;
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            padding-top: 0;
            padding-bottom: 0;
        }
        .accordion-content.expanded {
            max-height: 1000px; /* Arbitrary large number */
            opacity: 1;
            padding-top: 1rem;
            padding-bottom: 1rem;
        }
        .accordion-icon {
            transition: transform 0.3s ease-in-out;
        }
        .accordion-icon.rotated {
            transform: rotate(180deg);
        }

        /* Toast Animation */
        @keyframes slideUp {
            from { transform: translate(-50%, 100%); opacity: 0; }
            to { transform: translate(-50%, 0); opacity: 1; }
        }
        @keyframes slideDown {
            from { transform: translate(-50%, 0); opacity: 1; }
            to { transform: translate(-50%, 100%); opacity: 0; }
        }
        .toast-enter { animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .toast-exit { animation: slideDown 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        
        /* Card Hover Effects */
        .hover-card {
            transition: all 0.3s ease;
        }
        .hover-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            border-color: #00783d;
        }
        
        /* Gradation Background based on guideline */
        .bg-surya-gradient {
            background: linear-gradient(135deg, #fad96c 0%, #fdc26e 100%);
        }

        @media (max-width: 639px) {
            .hover-card:hover {
                transform: none;
            }

            #content-area {
                -webkit-overflow-scrolling: touch;
            }

            #toast-container {
                width: calc(100% - 2rem);
            }

            #toast-container > div {
                width: 100%;
                justify-content: center;
                text-align: center;
            }
        }

        .employee-hub-grid {
            background-image: linear-gradient(rgba(0, 120, 61, 0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 120, 61, 0.04) 1px, transparent 1px);
            background-size: 24px 24px;
        }

        .ai-widget {
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(12px);
        }

        .ai-question-btn {
            transition: all 0.2s ease;
        }

        .ai-question-btn:hover {
            border-color: #00783d;
            background: #def7e4;
            color: #00783d;
        }

        .sidebar-submenu {
            transition: max-height 0.25s ease, opacity 0.2s ease;
        }
    </style>
</head>
<body class="text-gray-800 h-screen flex overflow-hidden selection:bg-surya-green selection:text-white">

                </button>
                <img src="logo-green.png" alt="Suryanesia Logo" class="h-8 object-contain">
            </div>
            
            <!-- Global Search -->
            <div class="flex-1 max-w-2xl mx-auto md:mx-0 hidden sm:block">
                <div class="relative group">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <i class="fas fa-search text-gray-400 group-focus-within:text-surya-green transition-colors"></i>
                    </div>
                    <input type="text" id="search-input" class="block w-full pl-11 pr-12 py-2.5 border border-gray-200 rounded-xl leading-5 bg-gray-50 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-surya-lightgreen focus:border-surya-green focus:bg-white text-sm transition-all shadow-sm" placeholder="Search SOPs, policies, forms...">

                    </div>

                    <i class="fas fa-plus"></i>
                </button>

                </button>

    <!-- Public ticket form: prototype storage uses localStorage; production should use a backend/database. -->

            <div class="flex items-center justify-between border-b border-gray-100 px-6 py-5">

                </div>
                <button type="button" onclick="closeTicketForm()" class="rounded-lg p-2 text-gray-400 hover:bg-gray-100 hover:text-gray-700" aria-label="Tutup">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <form id="ticket-form" class="space-y-4 p-6">
                <label class="block">
                    <span class="mb-1.5 block text-sm font-bold text-gray-700" id="ticket-name-label">Name</span>
                    <input id="ticket-name" required maxlength="100" class="w-full rounded-xl border border-gray-200 bg-gray-50 px-4 py-3 text-sm outline-none focus:border-surya-green focus:ring-2 focus:ring-surya-lightgreen" placeholder="Nama lengkap">
                </label>
                <label class="block">
                    <span class="mb-1.5 block text-sm font-bold text-gray-700" id="ticket-email-label">Email / Contact</span>
                    <input id="ticket-email" required type="email" maxlength="120" class="w-full rounded-xl border border-gray-200 bg-gray-50 px-4 py-3 text-sm outline-none focus:border-surya-green focus:ring-2 focus:ring-surya-lightgreen" placeholder="nama@perusahaan.com">
                </label>
                <label class="block">
                    <span class="mb-1.5 block text-sm font-bold text-gray-700" id="ticket-department-label">Department</span>
                    <input id="ticket-department" required maxlength="80" class="w-full rounded-xl border border-gray-200 bg-gray-50 px-4 py-3 text-sm outline-none focus:border-surya-green focus:ring-2 focus:ring-surya-lightgreen" placeholder="Contoh: IT">
                </label>
                <label class="block">
                    <span class="mb-1.5 block text-sm font-bold text-gray-700" id="ticket-category-label">Category</span>
                    <select id="ticket-category" required class="w-full rounded-xl border border-gray-200 bg-gray-50 px-4 py-3 text-sm outline-none focus:border-surya-green focus:ring-2 focus:ring-surya-lightgreen">
                        <option>IT Support</option><option>Hardware</option><option>Software</option><option>Network</option><option>Account & Access</option><option>HR</option><option>Other</option>
                    </select>
                </label>
                <label class="block">
                    <span class="mb-1.5 block text-sm font-bold text-gray-700" id="ticket-priority-label">Priority</span>
                    <select id="ticket-priority" required class="w-full rounded-xl border border-gray-200 bg-gray-50 px-4 py-3 text-sm outline-none focus:border-surya-green focus:ring-2 focus:ring-surya-lightgreen">
                        <option>Low</option><option selected>Medium</option><option>High</option><option>Critical</option>
                    </select>
                </label>
                <label class="block">
                    <span class="mb-1.5 block text-sm font-bold text-gray-700" id="ticket-subject-label">Subjek</span>
                    <input id="ticket-subject" required maxlength="100" class="w-full rounded-xl border border-gray-200 bg-gray-50 px-4 py-3 text-sm outline-none focus:border-surya-green focus:ring-2 focus:ring-surya-lightgreen" placeholder="Contoh: Surat keterangan kerja">
                </label>
                <label class="block">
                    <span class="mb-1.5 block text-sm font-bold text-gray-700" id="ticket-description-label">Deskripsi</span>
                    <textarea id="ticket-description" required rows="4" class="w-full resize-none rounded-xl border border-gray-200 bg-gray-50 px-4 py-3 text-sm outline-none focus:border-surya-green focus:ring-2 focus:ring-surya-lightgreen" placeholder="Jelaskan kebutuhan Anda secara singkat"></textarea>
                </label>
                <label class="block">

        function generateTicketId() {
            const now = new Date();
            const stamp = `${now.getFullYear()}${String(now.getMonth() + 1).padStart(2, '0')}${String(now.getDate()).padStart(2, '0')}`;
            const tickets = loadData(STORAGE_KEYS.tickets, []);
            let count = Number(localStorage.getItem('suryanesia_ticket_counter') || '0') + 1;
            let id = `IT-${stamp}-${String(count).padStart(4, '0')}`;
            while (tickets.some((ticket) => ticket.id === id)) {
                count += 1;
                id = `IT-${stamp}-${String(count).padStart(4, '0')}`;
            }
            localStorage.setItem('suryanesia_ticket_counter', String(count));
            return id;
        }

        function generateRequestId() {
            const now = new Date();
            const stamp = `${now.getFullYear()}${String(now.getMonth() + 1).padStart(2, '0')}${String(now.getDate()).padStart(2, '0')}`;
            const count = Number(localStorage.getItem('suryanesia_request_counter') || '0') + 1;
            localStorage.setItem('suryanesia_request_counter', String(count));
            return `REQ-${stamp}-${String(count).padStart(4, '0')}`;
        }

        function createTicket(ticketData = {}) {
            const tickets = loadData(STORAGE_KEYS.tickets, []);
            const now = ticketData.createdAt || new Date().toISOString();
            const generatedTicket = {
                id: ticketData.id || generateTicketId(),
                name: ticketData.name || ticketData.employeeName || 'Employee',
                employeeName: ticketData.name || ticketData.employeeName || 'Employee',
                email: ticketData.email || '',
                employeeId: ticketData.employeeId || '',
                department: ticketData.department || 'IT',
                category: ticketData.category || 'Other',
                priority: ticketData.priority || 'Medium',
                subject: ticketData.subject || 'Support Request',
                description: ticketData.description || '',
                attachment: ticketData.attachment || null,
                createdAt: now,
                createdDate: ticketData.createdDate || now.slice(0, 10),
                updatedAt: ticketData.updatedAt || now,
                status: ticketData.status || 'Open',
                pic: ticketData.pic || null,
                resolution: ticketData.resolution || null,
                timeline: ticketData.timeline || [{ status: 'Open', at: now }]
            };
            tickets.unshift(generatedTicket);
            saveData(STORAGE_KEYS.tickets, tickets);
            return generatedTicket;
        }

        function getAllTickets() {
            return loadData(STORAGE_KEYS.tickets, []);
        }

        function getTicket(ticketId) {
            const normalizedId = String(ticketId || '').trim().toUpperCase();
            return getAllTickets().find((ticket) => String(ticket.id).toUpperCase() === normalizedId) || null;
        }

        function updateTicket(ticketId, changes = {}) {
            const tickets = getAllTickets();
            const index = tickets.findIndex((ticket) => ticket.id === ticketId);
            if (index < 0) return null;
            const current = tickets[index];
            const updatedAt = new Date().toISOString();
            const next = { ...current, ...changes, updatedAt };
            if (changes.status && changes.status !== current.status) {
                next.timeline = [...(current.timeline || []), { status: changes.status, at: updatedAt }];
            }
            tickets[index] = next;
            saveData(STORAGE_KEYS.tickets, tickets);
            return next;
        }

        function createRequest(requestData = {}) {
            const requests = loadData(STORAGE_KEYS.requests, []);
            const created = {
                requestId: requestData.requestId || generateRequestId(),
                requestType: requestData.requestType || 'General Request',
                employee: requestData.employee || 'Employee',
                description: requestData.description || '',
                date: requestData.date || new Date().toISOString().slice(0, 10),
                status: requestData.status || 'Pending'
            };
            requests.unshift(created);
            saveData(STORAGE_KEYS.requests, requests);
            return created;
        }

        function searchKnowledge(query) {
            const searchValue = (query || '').trim().toLowerCase();

            return knowledgeBase.filter((item) => {

                return keywords.some((word) => searchValue.includes(word) || word.includes(searchValue)) ||

                    item.answer.toLowerCase().includes(searchValue);
            });
        }

                '"': '&quot;',
                "'": '&#39;'

        function renderDashboardCalendar() {
            const calendar = document.getElementById('dashboard-calendar');
            const monthLabel = document.getElementById('dashboard-calendar-month');
            if (!calendar || !monthLabel) return;
            const copy = dashboardCopy();
            const locale = currentLang === 'id' ? 'id-ID' : 'en-US';
            const month = dashboardState.calendarMonth;
            monthLabel.textContent = new Intl.DateTimeFormat(locale, { month: 'long', year: 'numeric' }).format(month);
            const weekdays = currentLang === 'id'
                ? ['Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab', 'Min']
                : ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
            const offset = (month.getDay() + 6) % 7;
            const days = new Date(month.getFullYear(), month.getMonth() + 1, 0).getDate();
            const today = new Date();
            const cells = weekdays.map((day) => `<span class="py-2 text-center text-xs font-bold text-gray-400">${day}</span>`);
            for (let index = 0; index < offset; index += 1) cells.push('<span aria-hidden="true"></span>');
            for (let day = 1; day <= days; day += 1) {
                const isToday = today.getFullYear() === month.getFullYear() &&
                    today.getMonth() === month.getMonth() && today.getDate() === day;
                cells.push(`<span ${isToday ? 'aria-current="date"' : ''} class="mx-auto flex h-8 w-8 items-center justify-center rounded-full text-sm ${isToday ? 'bg-surya-green font-bold text-white' : 'text-gray-700'}">${day}</span>`);
            }
            calendar.innerHTML = `<div class="grid grid-cols-7 gap-y-1" role="grid" aria-label="${dashboardEscape(monthLabel.textContent)}">${cells.join('')}</div>`;
        }

        function moveDashboardCalendar(offset) {
            dashboardState.calendarMonth = new Date(
                dashboardState.calendarMonth.getFullYear(),
                dashboardState.calendarMonth.getMonth() + offset,
                1
            );
            renderDashboardCalendar();
        }

        function renderDashboardData() {
            const copy = dashboardCopy();
            const state = document.getElementById('dashboard-data-state');

            const metrics = document.getElementById('dashboard-metrics');
            const departments = document.getElementById('dashboard-departments');
            const status = document.getElementById('dashboard-status');

            state.classList.add('hidden');
            error.classList.add('hidden');
            metrics.replaceChildren();
            departments.replaceChildren();
            status.replaceChildren();

            if (dashboardState.loading) {
                state.textContent = copy.loading;
                state.classList.remove('hidden');
                return;

            if (dashboardState.error) {
                error.textContent = dashboardState.error;

                retry.className = 'ml-3 rounded-lg bg-white px-3 py-1.5 font-bold text-red-800 hover:bg-red-100';

                retry.addEventListener('click', refreshDashboard);

                error.classList.remove('hidden');
                return;
            }
            if (dashboardState.access) {
                state.textContent = dashboardState.access === 'unauthenticated' ? copy.signIn : copy.restricted;
                if (dashboardState.access === 'unauthenticated') {
                    const openDirectory = document.createElement('button');
                    openDirectory.type = 'button';
                    openDirectory.className = 'ml-3 rounded-lg bg-white px-3 py-1.5 font-bold text-amber-900 hover:bg-amber-100';
                    openDirectory.textContent = copy.openDirectory;
                    openDirectory.addEventListener('click', () => navigate('employees'));
                    state.append(openDirectory);

                state.classList.remove('hidden');
                return;
            }
            if (!dashboardState.data || !dashboardState.data.summary) {
                error.textContent = copy.loadError;
                error.classList.remove('hidden');
                return;
            }

            const summary = dashboardState.data.summary;
            const total = Number(summary.total);
            const active = Number(summary.active);
            const inactive = Number(summary.inactive);
            const departmentCount = Number(summary.departments);
            const newThisMonth = Number(summary.new_this_month);

                error.classList.remove('hidden');

            if (total === 0) {
                state.textContent = copy.noEmployees;

        async function initializeDashboard() {
            const requestId = ++dashboardState.requestId;
            dashboardState.loading = true;
            dashboardState.error = '';
            dashboardState.access = '';
            dashboardState.data = null;
            renderDashboard();
            try {
                const session = await employeeApi('/api/auth/session');
                if (requestId !== dashboardState.requestId) return;
                employeeState.authenticated = Boolean(session.authenticated);
                employeeState.user = session.user || null;
                employeeState.csrfToken = session.user?.csrfToken || '';
                dashboardState.userName = session.user?.name || session.user?.username || '';
                if (!session.authenticated) {
                    dashboardState.access = 'unauthenticated';
                    return;
                }
                if (!['hr_admin', 'system_admin'].includes(session.user?.role)) {
                    dashboardState.access = 'restricted';
                    return;
                }
                dashboardState.data = await employeeApi('/api/dashboard/summary');
            } catch (error) {
                if (requestId !== dashboardState.requestId) return;
                dashboardState.error = error.message || dashboardCopy().loadError;
            } finally {
                if (requestId === dashboardState.requestId) {
                    dashboardState.loading = false;
                    renderDashboard();
                }
            }
        }

        function refreshDashboard() {
            initializeDashboard();
        }

        async function employeeApi(path, options) {
            const requestOptions = Object.assign({ credentials: 'same-origin' }, options || {});
            requestOptions.headers = Object.assign({}, requestOptions.headers || {});
            if (requestOptions.body) requestOptions.headers['Content-Type'] = 'application/json';
            if (requestOptions.method && requestOptions.method !== 'GET' && employeeState.csrfToken) {
                requestOptions.headers['X-CSRF-Token'] = employeeState.csrfToken;
            }

            let response;
            try {
                response = await fetch(path, requestOptions);
            } catch (error) {
                throw new Error(employeeCopy().networkError);
            }
            const payload = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(payload.error || employeeCopy().loadError);
            return payload;
        }

        function normalizeEmployeeFilters(filters) {
            const value = (name, maxLength = 100) => (
                typeof filters?.[name] === 'string' ? filters[name].trim().slice(0, maxLength) : ''
            );
            const pageValue = Number.parseInt(filters?.page, 10);
            const sortBy = ['name', 'id', 'department', 'position', 'status'].includes(filters?.sortBy)
                ? filters.sortBy
                : 'name';
            return {
                search: value('search'),
                department: value('department'),
                position: value('position'),
                status: ['active', 'inactive'].includes(filters?.status) ? filters.status : '',
                sortBy,
                sortOrder: filters?.sortOrder === 'desc' ? 'desc' : 'asc',
                page: Number.isSafeInteger(pageValue) && pageValue > 0 ? Math.min(pageValue, 1000000) : 1
            };
        }

        function employeeRouteState() {
            const [route, query = ''] = window.location.hash.slice(1).split('?');
            const params = new URLSearchParams(query);
            return {
                route,
                filters: normalizeEmployeeFilters(Object.fromEntries(params.entries()))
            };
        }

        function employeeRouteHash() {
            const filters = normalizeEmployeeFilters({
                ...employeeState.filters,
                page: employeeState.page
            });
            const params = new URLSearchParams();
            Object.entries(filters).forEach(([key, value]) => {
                if (key === 'page' && value === 1) return;
                if (key === 'sortBy' && value === 'name') return;
                if (key === 'sortOrder' && value === 'asc') return;
                if (value) params.set(key, String(value));
            });
            const query = params.toString();
            return `#employees${query ? `?${query}` : ''}`;
        }

        function syncEmployeeRoute() {
            if (currentViewId === 'employees') {
                window.history.replaceState({ viewId: 'employees' }, '', employeeRouteHash());
            }
        }

        async function initializeEmployeeDirectory() {
            employeeState.page = employeeState.filters.page;
            const requestId = ++employeeState.requestId;
            employeeState.loading = true;
            employeeState.error = '';
            renderEmployeeDirectory();
            try {
                const session = await employeeApi('/api/auth/session');
                if (requestId !== employeeState.requestId) return;
                employeeState.authenticated = session.authenticated;
                employeeState.user = session.user || null;
                employeeState.csrfToken = session.user?.csrfToken || '';
                if (!session.authenticated) {
                    employeeState.employees = [];
                    employeeState.departments = [];
                    employeeState.summary = { total: 0, active: 0, inactive: 0, departments: 0 };
                    employeeState.total = 0;
                    employeeState.loading = false;
                    renderEmployeeDirectory();
                    return;
                }
                await loadEmployees();
            } catch (error) {
                if (requestId !== employeeState.requestId) return;
                employeeState.loading = false;
                employeeState.error = error.message;
                renderEmployeeDirectory();
            }
        }

        async function loadEmployees() {
            if (!employeeState.authenticated) return;
            employeeState.filters.page = employeeState.page;
            const requestId = ++employeeState.requestId;
            employeeState.loading = true;
            employeeState.error = '';
            renderEmployeeDirectory();
            const params = new URLSearchParams({
                search: employeeState.filters.search,
                department: employeeState.filters.department,
                position: employeeState.filters.position,
                status: employeeState.filters.status,
                sortBy: employeeState.filters.sortBy,
                sortOrder: employeeState.filters.sortOrder,
                page: String(employeeState.page),
                pageSize: String(employeeState.pageSize)
            });
            syncEmployeeRoute();
            try {
                const result = await employeeApi(`/api/employees?${params.toString()}`);
                if (requestId !== employeeState.requestId) return;
                employeeState.employees = result.employees;
                employeeState.departments = result.departments;
                employeeState.positions = result.positions || [];
                employeeState.summary = result.summary;
                employeeState.total = result.total;
                let invalidOptionFilter = false;
                if (employeeState.filters.department && !employeeState.departments.includes(employeeState.filters.department)) {
                    employeeState.filters.department = '';
                    invalidOptionFilter = true;
                }
                if (employeeState.filters.position && !employeeState.positions.includes(employeeState.filters.position)) {
                    employeeState.filters.position = '';
                    invalidOptionFilter = true;
                }
                if (invalidOptionFilter) {
                    syncEmployeeRoute();
                    await loadEmployees();
                    return;
                }
                const lastPage = Math.max(1, Math.ceil(result.total / employeeState.pageSize));
                if (employeeState.page > lastPage) {
                    employeeState.page = lastPage;
                    employeeState.filters.page = lastPage;
                    await loadEmployees();
                    return;
                }
            } catch (error) {
                if (requestId !== employeeState.requestId) return;
                employeeState.error = error.message;
            } finally {
                if (requestId === employeeState.requestId) {
                    employeeState.loading = false;
                    renderEmployeeDirectory();
                }
            }
        }

        function renderEmployeeDirectory() {
            const list = document.getElementById('employee-directory-list');
            if (!list) return;

            const isIndonesian = currentLang === 'id';
            list.replaceChildren();
            const loading = document.getElementById('employee-loading');
            const errorState = document.getElementById('employee-error-state');
            const errorMessage = document.getElementById('employee-error-message');
            const emptyState = document.getElementById('employee-empty-state');
            const summaryCards = document.getElementById('employee-summary-cards');
            const hasDirectoryAccess = employeeState.authenticated &&
                ['hr_admin', 'system_admin'].includes(employeeState.user?.role) &&
                !employeeState.error;
            if (summaryCards) {
                summaryCards.classList.toggle('hidden', !hasDirectoryAccess);
            }
            const authError = document.getElementById('employee-error');
            if (loading) loading.classList.toggle('hidden', !employeeState.loading);
            if (errorState) errorState.classList.toggle('hidden', !employeeState.error);
            if (errorMessage) errorMessage.textContent = employeeState.error;
            if (authError) {
                authError.classList.add('hidden');
                authError.textContent = '';
            }
            if (emptyState) {
                emptyState.classList.add('hidden');
                emptyState.textContent = '';
            }
            const table = list.closest('table');
            if (table) table.classList.toggle('hidden', !hasDirectoryAccess);
            if (!employeeState.authenticated && emptyState) {
                emptyState.textContent = isIndonesian ? 'Masuk untuk melihat direktori karyawan.' : 'Sign in to view employee records.';
                emptyState.classList.remove('hidden');
            }

            employeeState.employees.forEach((employee) => {
                const row = document.createElement('tr');
                const identityCell = document.createElement('td');
                identityCell.className = 'px-5 py-4';
                const name = document.createElement('p');
                name.className = 'font-bold text-gray-900';
                name.textContent = employee.name;
                const email = document.createElement('p');
                email.className = 'mt-1 break-all text-xs text-gray-500';
                email.textContent = employee.email;
                identityCell.append(name, email);
                row.append(identityCell);

                const employeeIdCell = document.createElement('td');
                employeeIdCell.className = 'px-5 py-4 font-medium text-gray-700';
                employeeIdCell.textContent = employee.id;
                row.append(employeeIdCell);

                [employee.department, employee.position].forEach((value) => {
                    const cell = document.createElement('td');
                    cell.className = 'px-5 py-4 text-gray-600';
                    cell.textContent = value;
                    row.append(cell);
                });

                const statusCell = document.createElement('td');
                statusCell.className = 'px-5 py-4';
                const statusBadge = document.createElement('span');
                statusBadge.className = employee.status === 'active'
                    ? 'rounded-full bg-green-100 px-2.5 py-1 text-xs font-bold text-green-700'
                    : 'rounded-full bg-gray-100 px-2.5 py-1 text-xs font-bold text-gray-600';
                statusBadge.textContent = employee.status === 'active'
                    ? (isIndonesian ? 'Aktif' : 'Active')
                    : (isIndonesian ? 'Tidak aktif' : 'Inactive');
                statusCell.append(statusBadge);
                row.append(statusCell);

                const actionCell = document.createElement('td');
                actionCell.className = 'px-5 py-4';
                const viewButton = document.createElement('button');
                viewButton.type = 'button';
                viewButton.className = 'employee-detail-button rounded-lg px-3 py-2 font-bold text-surya-green hover:bg-surya-lightgreen';
                viewButton.dataset.employeeId = employee.id;
                viewButton.textContent = isIndonesian ? 'Lihat' : 'View';
                actionCell.append(viewButton);
                if (['hr_admin', 'system_admin'].includes(employeeState.user?.role)) {
                    const editButton = document.createElement('button');
                    editButton.type = 'button';
                    editButton.className = 'employee-edit-button rounded-lg px-3 py-2 font-bold text-gray-700 hover:bg-gray-100';
                    editButton.dataset.employeeId = employee.id;
                    editButton.textContent = isIndonesian ? 'Edit' : 'Edit';
                    const statusButton = document.createElement('button');
                    statusButton.type = 'button';
                    statusButton.className = 'employee-status-button rounded-lg px-3 py-2 font-bold text-gray-700 hover:bg-gray-100';
                    statusButton.dataset.employeeId = employee.id;
                    statusButton.textContent = employee.status === 'active'
                        ? (isIndonesian ? 'Nonaktifkan' : 'Deactivate')
                        : (isIndonesian ? 'Aktifkan' : 'Activate');
                    statusButton.setAttribute(
                        'aria-label',
                        `${statusButton.textContent} ${employee.name}`
                    );
                    const deleteButton = document.createElement('button');
                    deleteButton.type = 'button';
                    deleteButton.className = 'employee-delete-button rounded-lg px-3 py-2 font-bold text-red-700 hover:bg-red-50';
                    deleteButton.dataset.employeeId = employee.id;
                    deleteButton.textContent = isIndonesian ? 'Hapus permanen' : 'Delete permanently';
                    actionCell.append(editButton, statusButton, deleteButton);
                }
                actionCell.classList.add('whitespace-nowrap');
                row.append(actionCell);
                list.append(row);
            });

            if (!employeeState.loading && !employeeState.error && employeeState.authenticated && employeeState.employees.length === 0 && emptyState) {
                const isEmptyDatabase = employeeState.summary.total === 0;
                emptyState.textContent = isEmptyDatabase
                    ? (isIndonesian ? 'Belum ada data karyawan.' : 'No employee records yet.')
                    : (isIndonesian ? 'Tidak ditemukan karyawan yang cocok.' : 'No employees match these filters.');
                emptyState.classList.remove('hidden');
            }

            const filter = document.getElementById('employee-department-filter');
            if (filter) {
                filter.replaceChildren(new Option(isIndonesian ? 'Semua departemen' : 'All departments', ''));
                employeeState.departments.forEach((department) => filter.add(new Option(department, department)));
                filter.value = employeeState.filters.department;
            }
            const positionFilter = document.getElementById('employee-position-filter');
            if (positionFilter) {
                positionFilter.replaceChildren(new Option(isIndonesian ? 'Semua jabatan' : 'All positions', ''));
                employeeState.positions.forEach((position) => positionFilter.add(new Option(position, position)));
                positionFilter.value = employeeState.filters.position;
            }
            const search = document.getElementById('employee-search');
            if (search && search.value !== employeeState.filters.search) search.value = employeeState.filters.search;
            const statusFilter = document.getElementById('employee-status-filter');
            if (statusFilter) statusFilter.value = employeeState.filters.status;

            document.getElementById('employee-count').textContent = hasDirectoryAccess ? String(employeeState.summary.total) : '—';
            document.getElementById('employee-active-count').textContent = hasDirectoryAccess ? String(employeeState.summary.active) : '—';
            document.getElementById('employee-inactive-count').textContent = hasDirectoryAccess ? String(employeeState.summary.inactive || 0) : '—';
            document.getElementById('employee-department-count').textContent = hasDirectoryAccess ? String(employeeState.summary.departments) : '—';
            document.getElementById('employee-header-count').textContent = hasDirectoryAccess ? String(employeeState.summary.total) : '—';
            const loginForm = document.getElementById('employee-login-form');
            const userPanel = document.getElementById('employee-user-panel');
            const addButton = document.getElementById('employee-add-button');
            if (loginForm) loginForm.classList.toggle('hidden', employeeState.authenticated);
            if (userPanel) {
                userPanel.classList.toggle('hidden', !employeeState.authenticated);
                userPanel.classList.toggle('flex', employeeState.authenticated);
            }
            if (addButton) {
                addButton.classList.toggle('hidden', !['hr_admin', 'system_admin'].includes(employeeState.user?.role));
            }
            const userLabel = document.getElementById('employee-user-label');
            if (userLabel && employeeState.user) {
                const role = employeeState.user.role.replace(/_/g, ' ');
                userLabel.textContent = `${employeeState.user.username} · ${role}${['employee', 'manager'].includes(employeeState.user.role) ? ` · ${employeeCopy().readOnly}` : ''}`;
            }
            const pagination = document.getElementById('employee-pagination');
            if (pagination) {
                const pageCount = Math.max(1, Math.ceil(employeeState.total / employeeState.pageSize));
                pagination.classList.toggle(
                    'hidden',
                    !employeeState.authenticated || employeeState.total <= employeeState.pageSize
                );
                pagination.classList.toggle(
                    'flex',
                    employeeState.authenticated && employeeState.total > employeeState.pageSize
                );
                document.getElementById('employee-page-summary').textContent =
                    `${currentLang === 'id' ? 'Halaman' : 'Page'} ${employeeState.page} / ${pageCount}`;
                document.getElementById('employee-page-previous').disabled =
                    employeeState.loading || employeeState.page <= 1;
                document.getElementById('employee-page-next').disabled =
                    employeeState.loading || employeeState.page >= pageCount;
            }
            document.querySelectorAll('.employee-sort-button').forEach((button) => {
                const active = button.dataset.sort === employeeState.filters.sortBy;
                const direction = active ? employeeState.filters.sortOrder : null;
                const sortLabels = isIndonesian
                    ? { name: 'Karyawan', id: 'ID Karyawan', department: 'Departemen', position: 'Jabatan', status: 'Status' }
                    : { name: 'Employee', id: 'Employee ID', department: 'Department', position: 'Position', status: 'Status' };
                button.setAttribute('aria-pressed', String(active));
                button.closest('th')?.setAttribute(
                    'aria-sort',
                    direction === 'asc' ? 'ascending' : direction === 'desc' ? 'descending' : 'none'
                );
                button.textContent = `${sortLabels[button.dataset.sort] || button.dataset.sort}${direction === 'asc' ? ' ↑' : direction === 'desc' ? ' ↓' : ''}`;
            });
        }

        document.addEventListener('click', async function (event) {
            const target = event.target;
            if (!(target instanceof Element)) return;

            const departmentChartButton = target.closest('[data-dashboard-department]');
            if (departmentChartButton) {
                navigate('employees', false, {
                    department: departmentChartButton.dataset.dashboardDepartment

            }
            const statusChartButton = target.closest('[data-dashboard-status]');
            if (statusChartButton) {
                navigate('employees', false, { status: statusChartButton.dataset.dashboardStatus });
                return;
            }
            if (target.closest('[data-employee-home]')) {
                navigate('home');
                return;
            }
            if (target.closest('#employee-clear-filters')) {
                clearTimeout(employeeSearchTimer);
                employeeState.filters = normalizeEmployeeFilters({});
                employeeState.page = 1;
                syncEmployeeRoute();
                await loadEmployees();
                return;
            }
            const sortButton = target.closest('.employee-sort-button');
            if (sortButton) {
                employeeState.filters.sortOrder = employeeState.filters.sortBy === sortButton.dataset.sort &&
                    employeeState.filters.sortOrder === 'asc' ? 'desc' : 'asc';
                employeeState.filters.sortBy = sortButton.dataset.sort;
                employeeState.page = 1;
                syncEmployeeRoute();
                await loadEmployees();
                return;
            }
            if (target.closest('#employee-add-button')) {
                await openEmployeeForm(null);
                return;
            }
            if (target.closest('#employee-form-close, #employee-form-cancel')) {
                closeEmployeeForm();
                return;
            }
            if (target.closest('#employee-detail-close')) {
                document.getElementById('employee-detail').classList.add('hidden');
                return;
            }
            if (target.closest('#employee-retry-button')) {
                await initializeEmployeeDirectory();
                return;
            }
            if (target.closest('#employee-page-previous') && employeeState.page > 1) {
                employeeState.page -= 1;
                await loadEmployees();
                return;
            }
            if (target.closest('#employee-page-next') && employeeState.page < Math.ceil(employeeState.total / employeeState.pageSize)) {
                employeeState.page += 1;
                await loadEmployees();
                return;
            }
            if (target.closest('#employee-logout-button')) {
                try {
                    await employeeApi('/api/auth/logout', { method: 'POST', body: '{}' });
                    employeeState.authenticated = false;
                    employeeState.user = null;
                    employeeState.csrfToken = '';
                    employeeState.employees = [];
                    employeeState.summary = { total: 0, active: 0, inactive: 0, departments: 0 };
                    renderEmployeeDirectory();
                } catch (error) {
                    showEmployeeError(error.message);
                }
                return;
            }

            const detailButton = target.closest('.employee-detail-button');
            if (detailButton) {
                await showEmployeeDetails(detailButton.dataset.employeeId);
                return;
            }
            const editButton = target.closest('.employee-edit-button');
            if (editButton) {
                const employee = employeeState.employees.find((item) => item.id === editButton.dataset.employeeId);
                if (employee) await openEmployeeForm(employee);
                return;
            }
            const statusButton = target.closest('.employee-status-button');
            if (statusButton) {
                await updateEmployeeStatus(statusButton.dataset.employeeId, statusButton);
                return;
            }
            const deleteButton = target.closest('.employee-delete-button');
            if (deleteButton) {
                if (!window.confirm(employeeCopy().deleteConfirm)) return;
                deleteButton.disabled = true;
                try {
                    await employeeApi(`/api/employees/${encodeURIComponent(deleteButton.dataset.employeeId)}`, { method: 'DELETE' });
                    document.getElementById('employee-detail').classList.add('hidden');
                    await loadEmployees();
                } catch (error) {
                    showEmployeeError(error.message || employeeCopy().deleteError);
                } finally {
                    if (deleteButton.isConnected) deleteButton.disabled = false;
                }
            }
        });

        document.addEventListener('submit', async function (event) {
            if (!(event.target instanceof HTMLFormElement)) return;
            if (event.target.id === 'employee-login-form') {
                event.preventDefault();
                const form = event.target;
                const submit = form.querySelector('button[type="submit"]');
                submit.disabled = true;
                try {
                    const result = await employeeApi('/api/auth/login', {
                        method: 'POST',
                        body: JSON.stringify({
                            username: form.elements.username.value.trim(),
                            password: form.elements.password.value
                        })
                    });
                    employeeState.authenticated = true;
                    employeeState.user = result.user;
                    employeeState.csrfToken = result.csrfToken;
                    form.reset();
                    await loadEmployees();
                } catch (error) {
                    showEmployeeError(error.message || employeeCopy().signInError);
                } finally {
                    submit.disabled = false;
                }
                return;
            }
            if (event.target.id !== 'employee-form') return;
            event.preventDefault();

            const form = event.target;
            const submit = form.querySelector('button[type="submit"]');
            const isEditing = Boolean(employeeState.editingId);
            const payload = {
                id: form.elements.employeeId.value.trim(),
                name: form.elements.employeeName.value.trim(),
                email: form.elements.employeeEmail.value.trim(),
                department: form.elements.employeeDepartment.value.trim(),
                position: form.elements.employeePosition.value.trim(),
                status: form.elements.employeeStatus.value
            };
            if (
                isEditing &&
                employeeState.editingRecord &&
                payload.status !== employeeState.editingRecord.status &&
                !window.confirm(employeeCopy().statusConfirm)
            ) return;
            if (isEditing && employeeState.editingRecord?.updated_at) {
                payload.updated_at = employeeState.editingRecord.updated_at;
            }
            submit.disabled = true;
            submit.textContent = employeeCopy().saving;
            try {
                await employeeApi(
                    isEditing
                        ? `/api/employees/${encodeURIComponent(employeeState.editingId)}`
                        : '/api/employees',
                    {
                        method: isEditing ? 'PUT' : 'POST',
                        body: JSON.stringify(payload)
                    }
                );

                form.reset();
                document.getElementById('employee-detail').classList.add('hidden');
                await loadEmployees();
                showToast(currentLang === 'id' ? 'Data karyawan berhasil disimpan.' : 'Employee record saved.');

                    closeEmployeeForm();
                    await loadEmployees();
                    showEmployeeError(employeeCopy().conflict);
                } else {
                    showEmployeeError(error.message || employeeCopy().saveError);
                }
            } finally {
                submit.disabled = false;
                submit.textContent = currentLang === 'id' ? 'Simpan' : 'Save';
            }
        });

        function submitAiQuery() {
            const input = document.getElementById('ai-user-input');
            const question = input ? input.value.trim() : '';
            if (!question) {
                renderAiAnswer('Silakan tulis pertanyaan Anda agar saya dapat membantu.');
                return;
            }
            const answer = answerAi(question);
            renderAiAnswer(answer.message);
            const ticketAction = document.getElementById('ai-ticket-action');
            if (ticketAction) {
                const showTicket = answer.canCreateTicket;
                ticketAction.classList.toggle('hidden', !showTicket);
                ticketAction.dataset.category = answer.category || 'IT';
                ticketAction.dataset.subject = answer.subject || 'Support Request';
                ticketAction.dataset.description = answer.description || question;
            }
        }

        function answerAi(question) {
            const normalized = question.toLowerCase();
            const match = knowledgeBase.find((item) => item.keywords.some((keyword) => normalized.includes(keyword.toLowerCase())));
            if (match) {
                const placeholder = match.category === 'HR' ? 'Request Center' : 'Create Support Ticket';
                return {
                    message: `${match.answer}<br><br><strong>Suggested questions:</strong> ${knowledgeBase.filter((item) => item.category === match.category).map((item) => item.keywords[0]).slice(0, 3).join(', ')}`,
                    canCreateTicket: true,
                    category: match.category,
                    subject: match.category === 'HR' ? 'HR Request' : 'IT Support Request',
                    description: `${match.answer}\n\nUser issue: ${question}`,
                    actionLabel: placeholder
                };
            }

            return {
                message: 'Maaf, saya belum menemukan informasi yang sesuai.<br><br><strong>Suggested questions:</strong> How do I request leave?, WiFi is not working, How do I contact IT Support?',
                canCreateTicket: true,
                category: 'Other',
                subject: 'General Support Request',
                description: `User asked: ${question}`
            };
        }

            const indent = isSubmenuItem ? 'ml-3 w-[calc(100%-0.75rem)] border-l border-gray-200 pl-3' : '';
            const icon = `<i class="fas ${item.icon} w-5 shrink-0 text-center text-base" aria-hidden="true"></i>`;
            const label = `<span class="min-w-0 flex-1">${navigationLabel(item.key)}</span>`;
            const current = active ? ' aria-current="page"' : '';

            if (item.type === 'action') {
                return `<button type="button" class="sidebar-item ${classes} ${indent}" onclick="toggleSidebar(false); ${item.action}()">${icon}${label}</button>`;
            }
            if (item.type === 'link') {
                return `<a href="${item.href}" class="sidebar-item ${classes} ${indent}">${icon}${label}</a>`;

            return `<button type="button" class="sidebar-item ${classes} ${indent}" data-route="${item.route}" onclick="navigate('${item.route}')"${current}>${icon}${label}</button>`;

            const nav = document.getElementById('sidebar-nav');
            if (!nav) return;

            const menu = [];
            menu.push(`<p class="px-3 pb-3 text-xs font-bold uppercase tracking-widest text-gray-400">${navigationLabel('main-menu')}</p>`);
            for (const item of sidebarMenu) {
                if (item.type === 'divider') {
                    if (item.key === 'helpdesk-divider') {
                        menu.push('<div class="my-4 border-t border-gray-100" role="separator"></div>');
                    } else {
                        menu.push('<div class="my-3 border-t border-gray-100" role="separator"></div>');
                    }
                    continue;
                }
                if (item.type === 'section') {
                    menu.push(`<p class="px-3 pb-2 pt-1 text-xs font-bold uppercase tracking-widest text-gray-400">${navigationLabel(item.key)}</p>`);
                    continue;
                }
                if (item.type !== 'group') {
                    menu.push(renderSidebarItem(item));
                    continue;
                }

                const groupIsCurrent = item.children.some((child) => child.route === currentViewId);
                const isOpen = expandedSidebarGroup === item.key;
                const submenuId = `sidebar-submenu-${item.key}`;
                const groupClasses = groupIsCurrent
                    ? 'text-surya-green'
                    : 'text-gray-600 hover:bg-surya-lightgreen hover:text-surya-green';
                menu.push(`
                    <div class="space-y-1">
                        <button type="button" class="flex w-full items-center gap-3 rounded-xl px-3 py-3 text-left text-sm font-semibold transition-colors ${groupClasses} focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-surya-green"
                            aria-expanded="${isOpen}" aria-controls="${submenuId}" onclick="toggleSidebarGroup('${item.key}')">
                            <i class="fas ${item.icon} w-5 shrink-0 text-center text-base" aria-hidden="true"></i>
                            <span class="min-w-0 flex-1">${navigationLabel(item.key)}</span>
                            <i class="fas fa-chevron-down text-xs transition-transform duration-200 ${isOpen ? 'rotate-180' : ''}" aria-hidden="true"></i>
                        </button>
                        <div id="${submenuId}" class="sidebar-submenu space-y-1 overflow-hidden pl-1 ${isOpen ? 'max-h-[32rem] opacity-100' : 'max-h-0 opacity-0'}" aria-hidden="${!isOpen}" ${isOpen ? '' : 'inert'}>
                            ${item.children.map((child) => renderSidebarItem(child, true)).join('')}
                        </div>
                    </div>
                `);
            }
            nav.innerHTML = menu.join('');
        }

        function toggleSidebarGroup(groupKey) {
            expandedSidebarGroup = expandedSidebarGroup === groupKey ? null : groupKey;
            renderSidebarNavigation();
            document.getElementById('sidebar-nav')
                ?.querySelector(`[aria-controls="sidebar-submenu-${groupKey}"]`)
                ?.focus();
        }

        function placeholderPage(viewId) {
            const item = getMenuItemForRoute(viewId);
            const title = item ? navigationLabel(item.key) : viewId;
            const parentKey = routeParentKeys[viewId];
            const parent = parentKey ? navigationLabel(parentKey) : '';
            const homeLabel = navigationLabel('home');
            const description = placeholderDescriptions[currentLang];
            return `
                <div class="fade-in mx-auto max-w-5xl p-4 pb-12 md:p-8">
                    <nav class="mb-6 flex flex-wrap items-center gap-2 text-sm text-gray-500" aria-label="${currentLang === 'id' ? 'Jejak navigasi' : 'Breadcrumb'}">
                        <button type="button" class="font-semibold hover:text-surya-green" onclick="navigate('home')">${homeLabel}</button>
                        ${parent && parent !== title ? `<i class="fas fa-chevron-right text-[10px] text-gray-300" aria-hidden="true"></i><span>${parent}</span>` : ''}
                        <i class="fas fa-chevron-right text-[10px] text-gray-300" aria-hidden="true"></i>
                        <span class="font-semibold text-gray-700" aria-current="page">${title}</span>
                    </nav>
                    <section class="rounded-3xl border border-gray-200 bg-white p-6 shadow-sm sm:p-9">
                        <div class="mb-5 flex h-12 w-12 items-center justify-center rounded-2xl bg-surya-lightgreen text-xl text-surya-green">
                            <i class="fas ${item?.icon || 'fa-layer-group'}" aria-hidden="true"></i>
                        </div>
                        <p class="text-xs font-bold uppercase tracking-widest text-surya-green">${parent || 'Suryanesia Employee Hub'}</p>
                        <h1 class="mt-2 text-2xl font-extrabold tracking-tight text-gray-900 sm:text-3xl">${title}</h1>
                        <p class="mt-3 max-w-2xl leading-relaxed text-gray-600">${description}</p>
                        <div class="mt-7 inline-flex items-start gap-3 rounded-xl border border-surya-yellow/70 bg-surya-lightyellow px-4 py-3 text-sm text-gray-700" role="status">
                            <i class="fas fa-circle-info mt-0.5 text-surya-green" aria-hidden="true"></i>
                            <span>${currentLang === 'id' ? 'Belum ada data atau proses HR yang terhubung pada halaman ini.' : 'No HR data or workflow is connected to this page yet.'}</span>
                        </div>
                    </section>
                </div>
            `;
        }

        function setLanguage(lang) {
            if (currentLang === lang) return;
            currentLang = lang;

            // Update language toggle button styles
            const btnEN = document.getElementById('btn-lang-en');
            const btnID = document.getElementById('btn-lang-id');
            
            if (lang === 'en') {
                btnEN.className = "px-3 py-1 rounded-full text-xs font-bold bg-white text-surya-green shadow-sm transition-colors";
                btnID.className = "px-3 py-1 rounded-full text-xs font-bold text-gray-500 hover:text-gray-700 transition-colors";
                showToast('English language selected');
            } else {
                btnID.className = "px-3 py-1 rounded-full text-xs font-bold bg-white text-surya-green shadow-sm transition-colors";
                btnEN.className = "px-3 py-1 rounded-full text-xs font-bold text-gray-500 hover:text-gray-700 transition-colors";
                showToast('Bahasa Indonesia dipilih');
            }

            const staticElements = {
                'txt-main-menu': uiTranslations[lang].mainMenu,
                'txt-nav-home': uiTranslations[lang].navHome,
                'txt-nav-employees': uiTranslations[lang].navEmployees,
                'txt-nav-ai': uiTranslations[lang].navAI,
                'txt-nav-create': uiTranslations[lang].navCreate,
                'txt-nav-check': uiTranslations[lang].navCheck,
                'txt-nav-knowledge': uiTranslations[lang].navKnowledge,
                'txt-nav-request': uiTranslations[lang].navRequest,
                'txt-nav-sop': uiTranslations[lang].navSOP,
                'txt-nav-policies': uiTranslations[lang].navPolicies,
                'txt-nav-announcements': uiTranslations[lang].navAnnouncements,
                'txt-nav-profile': uiTranslations[lang].navProfile,
                'txt-nav-corner-label': uiTranslations[lang].navCorner,
                'txt-nav-links-label': uiTranslations[lang].navLinks,
                'txt-nav-admin': uiTranslations[lang].navAdmin,
                'txt-profile-title': uiTranslations[lang].profileTitle,
                'txt-profile-sub': uiTranslations[lang].profileSub,
                'txt-new-ticket': uiTranslations[lang].newTicket,
                'ticket-modal-label': lang === 'id' ? 'HR Helpdesk' : 'HR Helpdesk',
                'ticket-modal-title': lang === 'id' ? 'Buat tiket baru' : 'Create a new ticket',
                'ticket-subject-label': lang === 'id' ? 'Subjek' : 'Subject',
                'ticket-description-label': lang === 'id' ? 'Deskripsi' : 'Description',
                'ticket-name-label': uiTranslations[lang].ticketName,
                'ticket-email-label': uiTranslations[lang].ticketEmail,
                'ticket-department-label': uiTranslations[lang].ticketDepartment,
                'ticket-category-label': uiTranslations[lang].ticketCategory,
                'ticket-priority-label': uiTranslations[lang].ticketPriority,
                'ticket-attachment-label': uiTranslations[lang].ticketAttachment,
                'ticket-cancel': lang === 'id' ? 'Batal' : 'Cancel',
                'ticket-submit': lang === 'id' ? 'Kirim tiket' : 'Submit ticket',
                'check-modal-label': uiTranslations[lang].checkLabel,
                'check-modal-title': uiTranslations[lang].checkTitle,
                'check-modal-submit': uiTranslations[lang].checkSubmit,
                'ai-title': uiTranslations[lang].aiTitle,
                'ai-greeting': uiTranslations[lang].aiGreeting,
                'ai-ask': uiTranslations[lang].aiAsk,
                'ai-create-ticket': uiTranslations[lang].aiCreateTicket
            };

            Object.entries(staticElements).forEach(([id, text]) => {
                const element = document.getElementById(id);
                if (element) element.innerText = text;
            });

            const searchInput = document.getElementById('search-input');
            if (searchInput) {
                searchInput.placeholder = uiTranslations[lang].searchPlaceholder;
            }
            const aiInput = document.getElementById('ai-user-input');
            if (aiInput) aiInput.placeholder = uiTranslations[lang].aiPlaceholder;

            // Instantly re-render the current view
            renderView(currentViewId, true);
        }

        function navigate(viewId, fromHistory = false, employeeFilters = null) {
            if (!isKnownRoute(viewId)) viewId = 'home';
            currentViewId = viewId;
            if (viewId === 'employees') {
                const routeFilters = employeeRouteState().filters;
                employeeState.filters = normalizeEmployeeFilters(
                    fromHistory ? routeFilters : employeeFilters || employeeState.filters
                );
                employeeState.page = employeeState.filters.page;
            }
            const nextHash = viewId === 'employees' && !fromHistory
                ? employeeRouteHash()
                : `#${viewId}`;
            if (!fromHistory && window.location.hash !== nextHash) {
                window.history.pushState({ viewId }, '', nextHash);
            }
            const parentKey = routeParentKeys[viewId];
            expandedSidebarGroup = sidebarMenu.some((item) => item.key === parentKey && item.type === 'group')
                ? parentKey
                : null;
            toggleSidebar(false);
            renderView(viewId, false);
        }

        function toggleSidebar(isOpen) {
            const sidebar = document.getElementById('sidebar');
            const backdrop = document.getElementById('sidebar-backdrop');
            if (!sidebar || !backdrop) return;

            sidebar.classList.toggle('-translate-x-full', !isOpen);
            sidebar.classList.toggle('translate-x-0', isOpen);
            backdrop.classList.toggle('hidden', !isOpen);
            const menuToggle = document.getElementById('sidebar-toggle');
            if (menuToggle) menuToggle.setAttribute('aria-expanded', String(isOpen));
        }

        function renderView(viewId, isLangSwitch) {
            const contentArea = document.getElementById('content-area');
            if (!contentArea) return;
            const requestId = ++renderRequestId;
            
            // Simple fade out
            contentArea.style.opacity = '0';
            
            setTimeout(() => {
                if (requestId !== renderRequestId) return;
                // Inject HTML using current view and language
                contentArea.innerHTML = viewId === 'employees'
                    ? employeeDirectoryView()
                    : placeholderRoutes.has(viewId) && !views[currentLang][viewId]
                        ? placeholderPage(viewId)
                        : views[currentLang][viewId] || views[currentLang]['home'];
                // Reset scroll unless we are just toggling languages
                if (!isLangSwitch) contentArea.scrollTop = 0; 
                // Fade in
                contentArea.style.opacity = '1';
                renderSidebarNavigation();
                if (viewId === 'employees') initializeEmployeeDirectory();
                if (viewId === 'home') initializeDashboard();
            }, 150);
        }

        window.addEventListener('popstate', () => {
            const viewId = employeeRouteState().route;
            const nextViewId = isKnownRoute(viewId) ? viewId : 'home';
            if (viewId !== nextViewId) window.history.replaceState({ viewId: nextViewId }, '', `#${nextViewId}`);
            navigate(nextViewId, true);
        });

        // Global Toast Notification Logic
        function showToast(message) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'bg-gray-900 text-white px-5 py-3 rounded-xl shadow-2xl text-sm font-medium flex items-center space-x-3 toast-enter pointer-events-auto border border-gray-700';
            toast.innerHTML = `<i class="fas fa-info-circle text-surya-yellow"></i><span>${message}</span>`;
            
            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.replace('toast-enter', 'toast-exit');
                setTimeout(() => {
                    if (container.contains(toast)) container.removeChild(toast);
                }, 300); 
            }, 2500);
        }

        function openTicketForm() {
            const modal = document.getElementById('ticket-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            document.getElementById('ticket-subject').focus();
        }

        function closeTicketForm() {
            const modal = document.getElementById('ticket-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        function openCheckTicket(ticketId = '') {
            const modal = document.getElementById('check-ticket-modal');
            const input = document.getElementById('check-ticket-id');
            if (input && ticketId) input.value = ticketId;
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            if (input) input.focus();
            if (ticketId) checkTicketStatus();
        }

        function closeCheckTicket() {
            const modal = document.getElementById('check-ticket-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        function checkTicketStatus() {
            const input = document.getElementById('check-ticket-id');
            const result = document.getElementById('ticket-result');
            const ticket = getTicket(input?.value);
            if (!result) return;
            result.classList.remove('hidden');
            if (!ticket) {
                const message = currentLang === 'id'
                    ? 'Ticket tidak ditemukan. Periksa kembali Ticket ID kamu.'
                    : 'Ticket not found. Please check the ticket ID and try again.';
                result.innerHTML = `<div class="rounded-xl border border-red-200 bg-red-50 p-4 text-sm text-red-700">${message}</div>`;
                return;
            }
            const timeline = (ticket.timeline || []).map((item) => `<li class="flex items-center gap-3"><span class="h-2.5 w-2.5 rounded-full bg-surya-green"></span><span class="font-semibold">${item.status}</span><span class="text-xs text-gray-500">${new Date(item.at).toLocaleString()}</span></li>`).join('');
            result.innerHTML = `<div class="space-y-4 rounded-2xl border border-gray-200 bg-gray-50 p-4 text-sm">
                <div class="grid gap-2 sm:grid-cols-2"><p><b>Ticket ID:</b> ${ticket.id}</p><p><b>Status:</b> ${ticket.status}</p><p><b>Subject:</b> ${ticket.subject}</p><p><b>Category:</b> ${ticket.category}</p><p><b>Priority:</b> ${ticket.priority}</p><p><b>Created Date:</b> ${ticket.createdAt || ticket.createdDate}</p><p><b>Last Updated:</b> ${ticket.updatedAt || ticket.createdAt || ticket.createdDate}</p><p><b>PIC:</b> ${ticket.pic || 'Not assigned'}</p></div>
                <p><b>Description:</b> ${ticket.description}</p><div><b>Timeline</b><ol class="mt-2 space-y-2">${timeline}</ol></div>
                <button type="button" onclick="navigator.clipboard?.writeText('${ticket.id}'); showToast('Ticket ID copied.')" class="rounded-xl bg-white px-3 py-2 text-xs font-bold text-surya-green shadow-sm">Copy Ticket ID</button>
            </div>`;
        }

        document.getElementById('ticket-form').addEventListener('submit', function (event) {
            event.preventDefault();
            const attachment = document.getElementById('ticket-attachment')?.files[0];
            const ticket = createTicket({
                name: document.getElementById('ticket-name').value.trim(),
                email: document.getElementById('ticket-email').value.trim(),
                department: document.getElementById('ticket-department').value.trim(),
                category: document.getElementById('ticket-category').value,
                priority: document.getElementById('ticket-priority').value,
                subject: document.getElementById('ticket-subject').value.trim(),
                description: document.getElementById('ticket-description').value.trim(),
                attachment: attachment ? { name: attachment.name, type: attachment.type, size: attachment.size } : null
            });

            closeTicketForm();
            this.reset();
            openCheckTicket(ticket.id);
            showToast(`Ticket berhasil dibuat. ID kamu: ${ticket.id}`);
        });

        // Accordion Logic for SOP Page
        function toggleAccordion(id, btnElement) {
            const content = document.getElementById(id);
            const icon = btnElement.querySelector('.accordion-icon');
            if (content.classList.contains('expanded')) {
                content.classList.remove('expanded');
                icon.classList.remove('rotated');
            } else {
                content.classList.add('expanded');
                icon.classList.add('rotated');
            }
        }

        // Initialize on load
        window.onload = function() {
            if (guardEmployeeAccess()) return;
            renderCurrentUserProfile();
            initializeData();
            initializeSearchBehavior();
            setLanguage('en');
            const initialRoute = employeeRouteState().route;
            navigate(isKnownRoute(initialRoute) ? initialRoute : 'home', true);
            if (!isKnownRoute(initialRoute)) {
                window.history.replaceState({ viewId: 'home' }, '', '#home');
            }
        };

        window.addEventListener('keydown', function (event) {
            if (event.key === 'Escape') {
                toggleSidebar(false);
                closeTicketForm();
                closeEmployeeForm();
            }
        });
    </script>
</body>
</html>
