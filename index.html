    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f8fafc;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent; 
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }

        /* Animations */
        .fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Accordion Styles */
        .accordion-content {
            transition: max-height 0.3s ease-in-out, opacity 0.3s ease-in-out, padding 0.3s ease-in-out;
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            padding-top: 0;
            padding-bottom: 0;
        }
        .accordion-content.expanded {
            max-height: 1000px; /* Arbitrary large number */
            opacity: 1;
            padding-top: 1rem;
            padding-bottom: 1rem;
        }
        .accordion-icon {
            transition: transform 0.3s ease-in-out;
        }
        .accordion-icon.rotated {
            transform: rotate(180deg);
        }

        /* Toast Animation */
        @keyframes slideUp {
            from { transform: translate(-50%, 100%); opacity: 0; }
            to { transform: translate(-50%, 0); opacity: 1; }
        }
        @keyframes slideDown {
            from { transform: translate(-50%, 0); opacity: 1; }
            to { transform: translate(-50%, 100%); opacity: 0; }
        }
        .toast-enter { animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .toast-exit { animation: slideDown 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        
        /* Card Hover Effects */
        .hover-card {
            transition: all 0.3s ease;
        }
        .hover-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            border-color: #00783d;
        }
        
        /* Gradation Background based on guideline */
        .bg-surya-gradient {
            background: linear-gradient(135deg, #fad96c 0%, #fdc26e 100%);
        }

        @media (max-width: 639px) {
            .hover-card:hover {
                transform: none;
            }

            #content-area {
                -webkit-overflow-scrolling: touch;
            }

            #toast-container {
                width: calc(100% - 2rem);
            }

            #toast-container > div {
                width: 100%;
                justify-content: center;
                text-align: center;
            }
        }

        .employee-hub-grid {
            background-image: linear-gradient(rgba(0, 120, 61, 0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 120, 61, 0.04) 1px, transparent 1px);
            background-size: 24px 24px;
        }

        .ai-widget {
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(12px);
        }

        .ai-question-btn {
            transition: all 0.2s ease;
        }

        .ai-question-btn:hover {
            border-color: #00783d;
            background: #def7e4;
            color: #00783d;
        }
    </style>

        function generateTicketId() {
            const now = new Date();
            const stamp = `${now.getFullYear()}${String(now.getMonth() + 1).padStart(2, '0')}${String(now.getDate()).padStart(2, '0')}`;
            const count = Number(localStorage.getItem('suryanesia_ticket_counter') || '0') + 1;
            localStorage.setItem('suryanesia_ticket_counter', String(count));
            return `IT-${stamp}-${String(count).padStart(4, '0')}`;
        }

        function generateRequestId() {
            const now = new Date();
            const stamp = `${now.getFullYear()}${String(now.getMonth() + 1).padStart(2, '0')}${String(now.getDate()).padStart(2, '0')}`;
            const count = Number(localStorage.getItem('suryanesia_request_counter') || '0') + 1;
            localStorage.setItem('suryanesia_request_counter', String(count));
            return `REQ-${stamp}-${String(count).padStart(4, '0')}`;
        }

        function createTicket(ticketData = {}) {
            const tickets = loadData(STORAGE_KEYS.tickets, []);
            const generatedTicket = {
                id: ticketData.id || generateTicketId(),
                employeeName: ticketData.employeeName || 'Employee',
                employeeId: ticketData.employeeId || 'EMP-001',
                department: ticketData.department || 'IT',
                category: ticketData.category || 'Other',
                priority: ticketData.priority || 'Medium',
                subject: ticketData.subject || 'Support Request',
                description: ticketData.description || '',
                createdDate: ticketData.createdDate || new Date().toISOString().slice(0, 10),
                status: ticketData.status || 'Open',
                pic: ticketData.pic || 'IT Support',
                resolution: ticketData.resolution || ''
            };
            tickets.unshift(generatedTicket);
            saveData(STORAGE_KEYS.tickets, tickets);
            return generatedTicket;
        }

        function createRequest(requestData = {}) {
            const requests = loadData(STORAGE_KEYS.requests, []);
            const created = {
                requestId: requestData.requestId || generateRequestId(),
                requestType: requestData.requestType || 'General Request',
                employee: requestData.employee || 'Employee',
                description: requestData.description || '',
                date: requestData.date || new Date().toISOString().slice(0, 10),
                status: requestData.status || 'Pending'
            };
            requests.unshift(created);
            saveData(STORAGE_KEYS.requests, requests);
            return created;
        }

        function getUserTickets() {
            return loadData(STORAGE_KEYS.tickets, []).filter((ticket) => ticket.employeeName === 'Employee' || ticket.employeeId === 'EMP-001');

        function searchKnowledge(query) {
            const searchValue = (query || '').trim().toLowerCase();
            if (!searchValue) return [];
            return knowledgeBase.filter((item) => {
                const keywords = item.keywords.map((word) => word.toLowerCase());
                return keywords.some((word) => searchValue.includes(word) || word.includes(searchValue)) ||
                    item.category.toLowerCase().includes(searchValue) ||
                    item.answer.toLowerCase().includes(searchValue);
            });
        }

            const input = document.getElementById('ai-user-input');
            const question = input ? input.value.trim() : '';
            if (!question) {
                renderAiAnswer('Silakan tulis pertanyaan Anda agar saya dapat membantu.');
                return;
            }
            const answer = answerAi(question);
            renderAiAnswer(answer.message);
            const ticketAction = document.getElementById('ai-ticket-action');
            if (ticketAction) {
                const showTicket = answer.canCreateTicket;
                ticketAction.classList.toggle('hidden', !showTicket);
                ticketAction.dataset.category = answer.category || 'IT';
                ticketAction.dataset.subject = answer.subject || 'Support Request';
                ticketAction.dataset.description = answer.description || question;
            }
        }

        function answerAi(question) {
            const normalized = question.toLowerCase();
            const match = knowledgeBase.find((item) => item.keywords.some((keyword) => normalized.includes(keyword.toLowerCase())));
            if (match) {
                const placeholder = match.category === 'HR' ? 'Request Center' : 'Create Support Ticket';
                return {
                    message: `${match.answer}<br><br><strong>Suggested questions:</strong> ${knowledgeBase.filter((item) => item.category === match.category).map((item) => item.keywords[0]).slice(0, 3).join(', ')}`,
                    canCreateTicket: true,
                    category: match.category,
                    subject: match.category === 'HR' ? 'HR Request' : 'IT Support Request',
                    description: `${match.answer}\n\nUser issue: ${question}`,
                    actionLabel: placeholder
                };
            }

            return {
                message: 'Maaf, saya belum menemukan informasi yang sesuai.<br><br><strong>Suggested questions:</strong> How do I request leave?, WiFi is not working, How do I contact IT Support?',
                canCreateTicket: true,
                category: 'Other',
                subject: 'General Support Request',
                description: `User asked: ${question}`
            };
        }

        function createAiTicketFromContext() {
            const action = document.getElementById('ai-ticket-action');
            const category = action?.dataset.category || 'Other';
            const subject = action?.dataset.subject || 'General Support Request';
            const description = action?.dataset.description || 'AI-generated support request.';
            openTicketForm();
            const categoryField = document.getElementById('ticket-category');
            const subjectField = document.getElementById('ticket-subject');
            const descriptionField = document.getElementById('ticket-description');
            if (categoryField) categoryField.value = category;
            if (subjectField) subjectField.value = subject;
            if (descriptionField) descriptionField.value = description;
            closeAiAssistant();
            showToast('AI-assisted ticket draft has been opened.');
        }

        document.addEventListener('click', function (event) {
            const button = event.target.closest('[data-question]');
            if (button) {
                const question = button.getAttribute('data-question');
                const input = document.getElementById('ai-user-input');
                if (input) input.value = question;
                const answer = answerAi(question);
                renderAiAnswer(answer.message);
                const ticketAction = document.getElementById('ai-ticket-action');
                if (ticketAction) {
                    ticketAction.classList.toggle('hidden', !answer.canCreateTicket);
                    ticketAction.dataset.category = answer.category || 'IT';
                    ticketAction.dataset.subject = answer.subject || 'Support Request';
                    ticketAction.dataset.description = answer.description || question;
                }
            }
        });

        function handleGlobalSearch(value) {
            const query = (value || '').trim();
            if (!query) return;
            const results = searchKnowledge(query);
            if (results.length > 0) {
                showToast(`Found ${results.length} knowledge result(s) for "${query}".`);
            } else {
                showToast('No matching knowledge base result. Try WiFi, leave, software, SOP, or IT support.');
            }
        }

        function initializeSearchBehavior() {
            const searchInput = document.getElementById('search-input');
            if (searchInput) {
                searchInput.addEventListener('input', function (event) {
                    handleGlobalSearch(event.target.value);
                });
            }
        }

        function syncNavigationButtons(viewId) {
            const navIds = ['nav-home', 'nav-request', 'nav-sop', 'nav-policies', 'nav-corner', 'nav-links'];
            navIds.forEach((id) => {
                const btn = document.getElementById(id);
                if (btn) {
                    btn.className = 'nav-btn w-full text-left flex items-center space-x-3 px-3 py-3 rounded-xl text-gray-600 hover:bg-surya-lightgreen hover:text-surya-green font-semibold transition-all';
                    if (id === 'nav-' + viewId) {
                        btn.className = 'nav-btn w-full text-left flex items-center space-x-3 px-3 py-3 rounded-xl text-surya-green bg-surya-lightgreen font-bold transition-all shadow-sm ring-1 ring-surya-green/20';
                    }
                }
            });
        }

        function getCurrentUser() {
            try {
                return JSON.parse(sessionStorage.getItem('currentUser') || 'null');
            } catch (error) {
                console.warn('Unable to read current user from sessionStorage.', error);
                return null;
            }
        }

        function renderCurrentUserProfile() {
            const currentUser = getCurrentUser();
            const initialsEl = document.getElementById('session-user-initials');
            const nameEl = document.getElementById('session-user-name');
            const deptEl = document.getElementById('session-user-dept');
            const roleBadgeEl = document.getElementById('session-user-role-badge');
            const adminDashboardBtn = document.getElementById('nav-admin-dashboard');
            const logoutBtn = document.getElementById('logout-button');

            if (!currentUser) return;
            if (initialsEl) initialsEl.textContent = (currentUser.name || 'Employee').split(' ').map((part) => part[0]).slice(0, 2).join('').toUpperCase();
            if (nameEl) nameEl.textContent = currentUser.name || 'Employee Demo';
            if (deptEl) deptEl.textContent = `${currentUser.department || 'IT'} Department`;
            if (roleBadgeEl) {
                const isAdmin = currentUser.role === 'admin';
                roleBadgeEl.textContent = isAdmin ? 'ADMIN' : 'EMPLOYEE';
                roleBadgeEl.className = isAdmin
                    ? 'inline-flex rounded-full bg-amber-100 px-2 py-1 text-[10px] font-bold uppercase tracking-widest text-amber-800'
                    : 'inline-flex rounded-full bg-gray-200 px-2 py-1 text-[10px] font-bold uppercase tracking-widest text-gray-700';
            }
            if (adminDashboardBtn) {
                const isAdmin = currentUser.role === 'admin';
                adminDashboardBtn.classList.toggle('hidden', !isAdmin);
            }
            if (logoutBtn) {
                logoutBtn.onclick = function () {
                    sessionStorage.removeItem('currentUser');
                    window.location.href = 'login.html';
                };
            }
        }

        function guardEmployeeAccess() {
            const currentUser = getCurrentUser();
            if (!currentUser) {
                window.location.href = 'login.html';
                return true;
            }
            return false;
        }

        function setLanguage(lang) {
            if (currentLang === lang) return;
            currentLang = lang;

            // Update language toggle button styles
            const btnEN = document.getElementById('btn-lang-en');
            const btnID = document.getElementById('btn-lang-id');
            
            if (lang === 'en') {
                btnEN.className = "px-3 py-1 rounded-full text-xs font-bold bg-white text-surya-green shadow-sm transition-colors";
                btnID.className = "px-3 py-1 rounded-full text-xs font-bold text-gray-500 hover:text-gray-700 transition-colors";
                showToast('English language selected');
            } else {
                btnID.className = "px-3 py-1 rounded-full text-xs font-bold bg-white text-surya-green shadow-sm transition-colors";
                btnEN.className = "px-3 py-1 rounded-full text-xs font-bold text-gray-500 hover:text-gray-700 transition-colors";
                showToast('Bahasa Indonesia dipilih');
            }

            const staticElements = {
                'txt-main-menu': uiTranslations[lang].mainMenu,
                'txt-nav-home': uiTranslations[lang].navHome,
                'txt-nav-request': uiTranslations[lang].navRequest,
                'txt-nav-sop': uiTranslations[lang].navSOP,
                'txt-nav-policies': uiTranslations[lang].navPolicies,
                'txt-nav-corner': uiTranslations[lang].navCorner,
                'txt-nav-links': uiTranslations[lang].navLinks,
                'txt-profile-title': uiTranslations[lang].profileTitle,
                'txt-profile-sub': uiTranslations[lang].profileSub,
                'txt-new-ticket': uiTranslations[lang].newTicket,
                'ticket-modal-label': lang === 'id' ? 'HR Helpdesk' : 'HR Helpdesk',
                'ticket-modal-title': lang === 'id' ? 'Buat tiket baru' : 'Create a new ticket',
                'ticket-category-label': lang === 'id' ? 'Kategori bantuan' : 'Support category',
                'ticket-subject-label': lang === 'id' ? 'Subjek' : 'Subject',
                'ticket-description-label': lang === 'id' ? 'Deskripsi' : 'Description',
                'ticket-cancel': lang === 'id' ? 'Batal' : 'Cancel',
                'ticket-submit': lang === 'id' ? 'Kirim tiket' : 'Submit ticket'
            };

            Object.entries(staticElements).forEach(([id, text]) => {
                const element = document.getElementById(id);
                if (element) element.innerText = text;
            });

            const searchInput = document.getElementById('search-input');
            if (searchInput) {
                searchInput.placeholder = uiTranslations[lang].searchPlaceholder;
            }

            // Instantly re-render the current view
            renderView(currentViewId, true);
        }

        function navigate(viewId) {
            currentViewId = viewId;
            toggleSidebar(false);
            renderView(viewId, false);
        }

        function toggleSidebar(isOpen) {
            const sidebar = document.getElementById('sidebar');
            const backdrop = document.getElementById('sidebar-backdrop');
            if (!sidebar || !backdrop) return;

            sidebar.classList.toggle('-translate-x-full', !isOpen);
            sidebar.classList.toggle('translate-x-0', isOpen);
            backdrop.classList.toggle('hidden', !isOpen);
        }

        function renderView(viewId, isLangSwitch) {
            const contentArea = document.getElementById('content-area');
            
            // Simple fade out
            contentArea.style.opacity = '0';
            
            setTimeout(() => {
                // Inject HTML using current view and language
                contentArea.innerHTML = views[currentLang][viewId] || views[currentLang]['home'];
                // Reset scroll unless we are just toggling languages
                if (!isLangSwitch) contentArea.scrollTop = 0; 
                // Fade in
                contentArea.style.opacity = '1';

                // Update Sidebar Active States
                const navIds = ['nav-home', 'nav-request', 'nav-sop', 'nav-policies', 'nav-corner', 'nav-links'];
                navIds.forEach(id => {
                    const btn = document.getElementById(id);
                    if(btn) {
                        btn.className = 'nav-btn w-full text-left flex items-center space-x-3 px-3 py-3 rounded-xl text-gray-600 hover:bg-surya-lightgreen hover:text-surya-green font-semibold transition-all';
                        if(id === 'nav-' + viewId) {
                            btn.className = 'nav-btn w-full text-left flex items-center space-x-3 px-3 py-3 rounded-xl text-surya-green bg-surya-lightgreen font-bold transition-all shadow-sm ring-1 ring-surya-green/20';
                        }
                    }
                });
            }, 150);
        }

        // Global Toast Notification Logic
        function showToast(message) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'bg-gray-900 text-white px-5 py-3 rounded-xl shadow-2xl text-sm font-medium flex items-center space-x-3 toast-enter pointer-events-auto border border-gray-700';
            toast.innerHTML = `<i class="fas fa-info-circle text-surya-yellow"></i><span>${message}</span>`;
            
            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.replace('toast-enter', 'toast-exit');
                setTimeout(() => {
                    if (container.contains(toast)) container.removeChild(toast);
                }, 300); 
            }, 2500);
        }

        function openTicketForm() {
            const modal = document.getElementById('ticket-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            document.getElementById('ticket-subject').focus();
        }

        function closeTicketForm() {
            const modal = document.getElementById('ticket-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        document.getElementById('ticket-form').addEventListener('submit', function (event) {
            event.preventDefault();
            const category = document.getElementById('ticket-category').value;
            const subject = document.getElementById('ticket-subject').value.trim();
            const description = document.getElementById('ticket-description').value.trim();
            const ticket = createTicket({
                category,
                subject,
                description,
                employeeName: 'Employee',
                employeeId: 'EMP-001',
                department: 'IT',
                priority: 'Medium',
                status: 'Open'
            });

            const message = currentLang === 'id'
                ? `Tiket "${ticket.subject}" berhasil dibuat dengan ID ${ticket.id}.`
                : `Ticket "${ticket.subject}" was created with ID ${ticket.id}.`;
            closeTicketForm();
            this.reset();
            showToast(message);
            navigate('my-tickets');
        });

        // Accordion Logic for SOP Page
        function toggleAccordion(id, btnElement) {
            const content = document.getElementById(id);
            const icon = btnElement.querySelector('.accordion-icon');
            if (content.classList.contains('expanded')) {
                content.classList.remove('expanded');
                icon.classList.remove('rotated');
            } else {
                content.classList.add('expanded');
                icon.classList.add('rotated');
            }
        }

        // Initialize on load
        window.onload = function() {
            if (guardEmployeeAccess()) return;
            renderCurrentUserProfile();
            initializeData();
            initializeSearchBehavior();
            setLanguage('id');
            navigate('home');
        };

        window.addEventListener('keydown', function (event) {
            if (event.key === 'Escape') {
                toggleSidebar(false);
                closeTicketForm();
            }
        });
    </script>
</body>
</html>
