    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f8fafc;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent; 
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }

        /* Animations */
        .fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Accordion Styles */
        .accordion-content {
            transition: max-height 0.3s ease-in-out, opacity 0.3s ease-in-out, padding 0.3s ease-in-out;
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            padding-top: 0;
            padding-bottom: 0;
        }
        .accordion-content.expanded {
            max-height: 1000px; /* Arbitrary large number */
            opacity: 1;
            padding-top: 1rem;
            padding-bottom: 1rem;
        }
        .accordion-icon {
            transition: transform 0.3s ease-in-out;
        }
        .accordion-icon.rotated {
            transform: rotate(180deg);
        }

        /* Toast Animation */
        @keyframes slideUp {
            from { transform: translate(-50%, 100%); opacity: 0; }
            to { transform: translate(-50%, 0); opacity: 1; }
        }
        @keyframes slideDown {
            from { transform: translate(-50%, 0); opacity: 1; }
            to { transform: translate(-50%, 100%); opacity: 0; }
        }
        .toast-enter { animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .toast-exit { animation: slideDown 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        
        /* Card Hover Effects */
        .hover-card {
            transition: all 0.3s ease;
        }
        .hover-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            border-color: #00783d;
        }
        
        /* Gradation Background based on guideline */
        .bg-surya-gradient {
            background: linear-gradient(135deg, #fad96c 0%, #fdc26e 100%);
        }

        @media (max-width: 639px) {
            .hover-card:hover {
                transform: none;
            }

            #content-area {
                -webkit-overflow-scrolling: touch;
            }

            #toast-container {
                width: calc(100% - 2rem);
            }

            #toast-container > div {
                width: 100%;
                justify-content: center;
                text-align: center;
            }
        }
    </style>
</head>

                `,
                sop: `<div class="fade-in max-w-5xl mx-auto p-4 md:p-8 pb-12"><div class="mb-8"><span class="text-surya-green font-bold text-sm tracking-wider uppercase mb-2 block">Pustaka</span><h2 class="text-3xl font-extrabold text-gray-900 tracking-tight">SOP & Panduan</h2><p class="text-gray-500 mt-2 text-base max-w-2xl">Kumpulan Standar Operasional Prosedur berdasarkan fungsi departemen. Dokumen master disimpan di Google Drive.</p></div><div class="bg-white rounded-2xl border border-gray-200 shadow-sm overflow-hidden"><div class="border-b border-gray-100 last:border-0"><button class="w-full px-6 py-5 flex items-center justify-between focus:outline-none hover:bg-gray-50 transition-colors" onclick="toggleAccordion('sop-hr-id', this)"><div class="flex items-center space-x-4"><div class="w-10 h-10 bg-surya-lightgreen text-surya-green rounded-lg flex items-center justify-center"><i class="fas fa-users"></i></div><div class="text-left"><span class="font-bold text-gray-900 text-lg block">Sumber Daya Manusia (HR)</span><span class="text-xs text-gray-500">Rekrutmen, Onboarding, Penggajian, Kinerja</span></div></div><i class="fas fa-chevron-down text-gray-400 accordion-icon"></i></button><div id="sop-hr-id" class="accordion-content bg-gray-50/50"><div class="px-6 py-4 grid grid-cols-1 sm:grid-cols-2 gap-3"><a href="#" onclick="showToast('Membuka Dokumen'); return false;" class="flex items-center p-3 rounded-xl hover:bg-white border border-transparent text-sm font-medium text-gray-700"><i class="fab fa-google-drive text-gray-400 mr-3 text-lg"></i> SOP Rekrutmen</a><a href="#" onclick="showToast('Membuka Dokumen'); return false;" class="flex items-center p-3 rounded-xl hover:bg-white border border-transparent text-sm font-medium text-gray-700"><i class="fab fa-google-drive text-gray-400 mr-3 text-lg"></i> SOP Onboarding & Offboarding</a><a href="#" onclick="showToast('Membuka Dokumen'); return false;" class="flex items-center p-3 rounded-xl hover:bg-white border border-transparent text-sm font-medium text-gray-700"><i class="fab fa-google-drive text-gray-400 mr-3 text-lg"></i> SOP Cuti & Kehadiran</a></div></div></div></div></div>`,
                policies: `<div class="fade-in max-w-5xl mx-auto p-4 md:p-8 pb-12"><div class="mb-8"><span class="text-surya-green font-bold text-sm tracking-wider uppercase mb-2 block">Peraturan Perusahaan</span><h2 class="text-3xl font-extrabold text-gray-900 tracking-tight">Kebijakan</h2><p class="text-gray-500 mt-2 text-base max-w-2xl">Dokumen kebijakan resmi perusahaan yang mengatur hak, kewajiban, dan kode etik karyawan.</p></div><div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5"><div onclick="showToast('Membuka Peraturan Perusahaan')" class="bg-white p-5 rounded-2xl border border-gray-200 cursor-pointer transition-all"><div class="w-10 h-10 rounded-lg bg-red-50 text-red-600 flex items-center justify-center text-lg mb-4"><i class="fas fa-book-open"></i></div><h3 class="font-bold text-gray-900 text-base mb-1">Peraturan Perusahaan</h3><p class="text-xs text-gray-500">Dokumen Peraturan Perusahaan utama yang terdaftar di Disnaker.</p></div><div onclick="showToast('Membuka Kebijakan Perjalanan')" class="bg-white p-5 rounded-2xl border border-gray-200 cursor-pointer transition-all"><div class="w-10 h-10 rounded-lg bg-green-50 text-green-600 flex items-center justify-center text-lg mb-4"><i class="fas fa-suitcase"></i></div><h3 class="font-bold text-gray-900 text-base mb-1">Kebijakan Perjalanan Dinas</h3><p class="text-xs text-gray-500">Tunjangan perjalanan dinas, akomodasi, dan batas per diem.</p></div></div></div>`,
                corner: `<div class="fade-in max-w-5xl mx-auto p-4 md:p-8 pb-12"><div class="mb-8"><span class="text-surya-green font-bold text-sm tracking-wider uppercase mb-2 block">Pengembangan & Kehidupan</span><h2 class="text-3xl font-extrabold text-gray-900 tracking-tight">Pojok Karyawan</h2><p class="text-gray-500 mt-2 text-base max-w-2xl">Materi mengenai siklus hidup karyawan, pengembangan karir, panduan, dan FAQ internal.</p></div><div onclick="showToast('Membuka Buku Panduan')" class="mb-8 bg-surya-gradient rounded-2xl p-6 sm:p-8 flex flex-col md:flex-row items-center justify-between gap-6 cursor-pointer"><div class="z-10 text-gray-900"><h3 class="text-2xl font-extrabold mb-2">Buku Panduan Karyawan Suryanesia</h3><p class="text-sm font-medium opacity-90 max-w-lg">Buku saku digital komprehensif tentang budaya kerja, nilai-nilai, dan informasi penting.</p></div><button class="z-10 bg-gray-900 text-white font-bold py-3 px-6 rounded-xl shadow-sm">Baca Panduan ↗</button></div></div>`,
                links: `<div class="fade-in max-w-5xl mx-auto p-4 md:p-8 pb-12"><div class="mb-8"><span class="text-surya-green font-bold text-sm tracking-wider uppercase mb-2 block">Alat & Platform</span><h2 class="text-3xl font-extrabold text-gray-900 tracking-tight">Tautan Cepat</h2><p class="text-gray-500 mt-2 text-base max-w-2xl">Akses langsung ke aplikasi pihak ketiga dan sistem internal yang digunakan.</p></div><div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4"><a href="#" onclick="showToast('Membuka Talenta'); return false;" class="bg-white border border-gray-200 rounded-xl p-5 flex flex-col items-center justify-center text-center"><div class="w-14 h-14 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center text-2xl mb-3"><i class="fas fa-id-badge"></i></div><h3 class="font-bold text-gray-900 text-sm">Talenta</h3><p class="text-[11px] text-gray-500 mt-1">HRIS, Kehadiran, Penggajian</p></a></div></div>`
            }
        };

        function setLanguage(lang) {
            if (currentLang === lang) return;
            currentLang = lang;

            // Update language toggle button styles
            const btnEN = document.getElementById('btn-lang-en');
            const btnID = document.getElementById('btn-lang-id');
            
            if (lang === 'en') {
                btnEN.className = "px-3 py-1 rounded-full text-xs font-bold bg-white text-surya-green shadow-sm transition-colors";
                btnID.className = "px-3 py-1 rounded-full text-xs font-bold text-gray-500 hover:text-gray-700 transition-colors";
                showToast('English language selected');
            } else {
                btnID.className = "px-3 py-1 rounded-full text-xs font-bold bg-white text-surya-green shadow-sm transition-colors";
                btnEN.className = "px-3 py-1 rounded-full text-xs font-bold text-gray-500 hover:text-gray-700 transition-colors";
                showToast('Bahasa Indonesia dipilih');
            }

            // Update static elements
            document.getElementById('txt-main-menu').innerText = uiTranslations[lang].mainMenu;
            document.getElementById('txt-nav-home').innerText = uiTranslations[lang].navHome;
            document.getElementById('txt-nav-request').innerText = uiTranslations[lang].navRequest;
            document.getElementById('txt-nav-sop').innerText = uiTranslations[lang].navSOP;
            document.getElementById('txt-nav-policies').innerText = uiTranslations[lang].navPolicies;
            document.getElementById('txt-nav-corner').innerText = uiTranslations[lang].navCorner;
            document.getElementById('txt-nav-links').innerText = uiTranslations[lang].navLinks;
            document.getElementById('txt-profile-title').innerText = uiTranslations[lang].profileTitle;
            document.getElementById('txt-profile-sub').innerText = uiTranslations[lang].profileSub;
            document.getElementById('txt-new-ticket').innerText = uiTranslations[lang].newTicket;
            document.getElementById('search-input').placeholder = uiTranslations[lang].searchPlaceholder;
            document.getElementById('ticket-modal-label').innerText = lang === 'id' ? 'HR Helpdesk' : 'HR Helpdesk';
            document.getElementById('ticket-modal-title').innerText = lang === 'id' ? 'Buat tiket baru' : 'Create a new ticket';
            document.getElementById('ticket-category-label').innerText = lang === 'id' ? 'Kategori bantuan' : 'Support category';
            document.getElementById('ticket-subject-label').innerText = lang === 'id' ? 'Subjek' : 'Subject';
            document.getElementById('ticket-description-label').innerText = lang === 'id' ? 'Deskripsi' : 'Description';
            document.getElementById('ticket-cancel').innerText = lang === 'id' ? 'Batal' : 'Cancel';
            document.getElementById('ticket-submit').innerText = lang === 'id' ? 'Kirim tiket' : 'Submit ticket';

            // Instantly re-render the current view
            renderView(currentViewId, true);
        }

        function navigate(viewId) {
            currentViewId = viewId;
            toggleSidebar(false);
            renderView(viewId, false);
        }

        function toggleSidebar(isOpen) {
            const sidebar = document.getElementById('sidebar');
            const backdrop = document.getElementById('sidebar-backdrop');
            if (!sidebar || !backdrop) return;

            sidebar.classList.toggle('-translate-x-full', !isOpen);
            sidebar.classList.toggle('translate-x-0', isOpen);
            backdrop.classList.toggle('hidden', !isOpen);
        }

        function renderView(viewId, isLangSwitch) {
            const contentArea = document.getElementById('content-area');
            
            // Simple fade out
            contentArea.style.opacity = '0';
            
            setTimeout(() => {
                // Inject HTML using current view and language
                contentArea.innerHTML = views[currentLang][viewId] || views[currentLang]['home'];
                // Reset scroll unless we are just toggling languages
                if (!isLangSwitch) contentArea.scrollTop = 0; 
                // Fade in
                contentArea.style.opacity = '1';

                // Update Sidebar Active States
                const navIds = ['nav-home', 'nav-request', 'nav-sop', 'nav-policies', 'nav-corner', 'nav-links'];
                navIds.forEach(id => {
                    const btn = document.getElementById(id);
                    if(btn) {
                        btn.className = 'nav-btn w-full text-left flex items-center space-x-3 px-3 py-3 rounded-xl text-gray-600 hover:bg-surya-lightgreen hover:text-surya-green font-semibold transition-all';
                        if(id === 'nav-' + viewId) {
                            btn.className = 'nav-btn w-full text-left flex items-center space-x-3 px-3 py-3 rounded-xl text-surya-green bg-surya-lightgreen font-bold transition-all shadow-sm ring-1 ring-surya-green/20';
                        }
                    }
                });
            }, 150);
        }

        // Global Toast Notification Logic
        function showToast(message) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'bg-gray-900 text-white px-5 py-3 rounded-xl shadow-2xl text-sm font-medium flex items-center space-x-3 toast-enter pointer-events-auto border border-gray-700';
            toast.innerHTML = `<i class="fas fa-info-circle text-surya-yellow"></i><span>${message}</span>`;
            
            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.replace('toast-enter', 'toast-exit');
                setTimeout(() => {
                    if (container.contains(toast)) container.removeChild(toast);
                }, 300); 
            }, 2500);
        }

        function openTicketForm() {
            const modal = document.getElementById('ticket-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            document.getElementById('ticket-subject').focus();
        }

        function closeTicketForm() {
            const modal = document.getElementById('ticket-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        document.getElementById('ticket-form').addEventListener('submit', function (event) {
            event.preventDefault();
            const subject = document.getElementById('ticket-subject').value.trim();
            const message = currentLang === 'id'
                ? `Tiket "${subject}" berhasil dibuat. Tim HR akan segera menindaklanjuti.`
                : `Ticket "${subject}" was created. The HR team will follow up shortly.`;
            closeTicketForm();
            this.reset();
            showToast(message);
        });

        // Accordion Logic for SOP Page
        function toggleAccordion(id, btnElement) {
            const content = document.getElementById(id);
            const icon = btnElement.querySelector('.accordion-icon');
            if (content.classList.contains('expanded')) {
                content.classList.remove('expanded');
                icon.classList.remove('rotated');
            } else {
                content.classList.add('expanded');
                icon.classList.add('rotated');
            }
        }

        // Initialize on load
        window.onload = function() {
            setLanguage('id');
            navigate('home');
        };

        window.addEventListener('keydown', function (event) {
            if (event.key === 'Escape') {
                toggleSidebar(false);
                closeTicketForm();
            }
        });
    </script>
</body>
</html>
