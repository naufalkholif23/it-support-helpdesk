<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <title>Sign In | Suryanesia Employee Hub</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        surya: {
                            green: '#00783d',
                            lightgreen: '#def7e4'
                        }
                    },
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif']
                    }
                }
            }
        };
    </script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: radial-gradient(circle at 12% 10%, rgba(0, 120, 61, 0.08), transparent 34%), #f8fafc;
        }

        .input-shell {
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .input-shell:focus-within {
            border-color: #00783d;
            box-shadow: 0 0 0 4px rgba(0, 120, 61, 0.12);
        }
    </style>
</head>
<body class="min-h-screen text-gray-800">
    <main class="flex min-h-screen items-center justify-center px-4 py-10 sm:px-6">
        <section class="w-full max-w-md rounded-[28px] border border-gray-200 bg-white p-6 shadow-[0_24px_80px_rgba(15,23,42,0.08)] sm:p-9" aria-labelledby="login-title">
            <header class="mb-8 text-center">
                <img src="logo-green.png" alt="Suryanesia" class="mx-auto h-12 w-auto object-contain">
                <p class="mt-4 text-xs font-extrabold uppercase tracking-[0.3em] text-surya-green">Employee Hub</p>
                <h1 id="login-title" class="mt-3 text-3xl font-extrabold tracking-tight text-gray-900">Welcome Back</h1>
                <p class="mt-2 text-sm leading-6 text-gray-500">Sign in to access your Suryanesia Employee Hub.</p>
            </header>

            <div id="session-check" class="mb-5 rounded-xl bg-gray-50 px-4 py-3 text-center text-sm text-gray-500" role="status" aria-live="polite">
                Checking your sign-in session...
            </div>
            <div id="login-error" class="mb-5 hidden rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700" role="alert"></div>
            <form id="login-form" class="hidden space-y-5" novalidate>
                <label for="login-email" class="block text-sm font-bold text-gray-700">
                    Work email
                    <span class="input-shell mt-2 flex items-center rounded-2xl border border-gray-200 bg-gray-50 px-4">
                        <i class="fas fa-envelope text-gray-400" aria-hidden="true"></i>
                        <input id="login-email" name="email" type="email" autocomplete="username" inputmode="email" maxlength="254" required class="min-w-0 w-full border-0 bg-transparent px-3 py-3.5 text-sm font-normal text-gray-800 outline-none placeholder:text-gray-400" placeholder="Enter your work email">
                    </span>
                </label>
                <label for="login-password" class="block text-sm font-bold text-gray-700">
                    Password
                    <span class="input-shell mt-2 flex items-center rounded-2xl border border-gray-200 bg-gray-50 px-4">
                        <i class="fas fa-lock text-gray-400" aria-hidden="true"></i>
                        <input id="login-password" name="password" type="password" autocomplete="current-password" required class="min-w-0 w-full border-0 bg-transparent px-3 py-3.5 text-sm font-normal text-gray-800 outline-none placeholder:text-gray-400" placeholder="Enter your password">
                        <button id="password-visibility" type="button" class="shrink-0 rounded-lg px-2 py-1 text-xs font-bold text-surya-green hover:bg-surya-lightgreen focus:outline-none focus:ring-2 focus:ring-surya-green" aria-label="Show password" aria-pressed="false">Show</button>
                    </span>
                </label>
                <button id="login-submit" type="submit" class="flex w-full items-center justify-center gap-2 rounded-2xl bg-surya-green px-4 py-3.5 text-sm font-bold text-white shadow-sm transition hover:bg-green-800 focus:outline-none focus:ring-4 focus:ring-green-200 disabled:cursor-wait disabled:opacity-70">
                    <span id="login-submit-label">Sign In</span>
                    <span id="login-spinner" class="hidden h-4 w-4 animate-spin rounded-full border-2 border-white/40 border-t-white" aria-hidden="true"></span>
                </button>
            </form>

            <p class="mt-8 text-center text-xs text-gray-400">© 2026 Suryanesia. All rights reserved.</p>
        </section>
    </main>

    <script>
        const form = document.getElementById('login-form');
        const emailInput = document.getElementById('login-email');
        const passwordInput = document.getElementById('login-password');
        const submitButton = document.getElementById('login-submit');
        const submitLabel = document.getElementById('login-submit-label');
        const spinner = document.getElementById('login-spinner');
        const errorBox = document.getElementById('login-error');
        const sessionCheck = document.getElementById('session-check');
        let submitting = false;

        function loginDestination() {
            const requested = new URLSearchParams(window.location.search).get('next');
            if (requested) {
                try {
                    const destination = new URL(requested, window.location.origin);
                    if (
                        destination.origin === window.location.origin &&
                        ['/', '/index.html'].includes(destination.pathname)
                    ) {
                        return `${destination.pathname}${destination.hash || '#home'}`;
                    }
                } catch {
                    // Invalid return paths fall back to the Dashboard.
                }
            }
            return 'index.html#home';
        }

        function showError(message) {
            errorBox.textContent = message;
            errorBox.classList.remove('hidden');
        }

        async function verifyExistingSession() {
            const reason = new URLSearchParams(window.location.search).get('reason');
            if (reason === 'session-expired') {
                showError('Your session has expired. Please sign in again.');
            }
            try {
                const response = await fetch('/api/auth/session', {
                    credentials: 'same-origin',
                    cache: 'no-store'
                });
                if (!response.ok) throw new Error('Session verification failed.');
                const session = await response.json();
                if (session.authenticated) {
                    window.location.replace(loginDestination());
                    return;
                }
                sessionCheck.classList.add('hidden');
                form.classList.remove('hidden');
                emailInput.focus();
            } catch {
                sessionCheck.replaceChildren(
                    document.createTextNode('Unable to connect to the server. Check your connection and try again.')
                );
                sessionCheck.classList.remove('hidden');
                sessionCheck.classList.add('border', 'border-red-200', 'bg-red-50', 'text-red-700');
                const retry = document.createElement('button');
                retry.type = 'button';
                retry.className = 'ml-2 font-bold underline';
                retry.textContent = 'Retry';
                retry.addEventListener('click', verifyExistingSession);
                sessionCheck.append(retry);
            }
        }

        document.getElementById('password-visibility').addEventListener('click', function () {
            const showPassword = passwordInput.type === 'password';
            passwordInput.type = showPassword ? 'text' : 'password';
            this.textContent = showPassword ? 'Hide' : 'Show';
            this.setAttribute('aria-label', showPassword ? 'Hide password' : 'Show password');
            this.setAttribute('aria-pressed', String(showPassword));
            passwordInput.focus();
        });

        form.addEventListener('submit', async function (event) {
            event.preventDefault();
            if (submitting) return;
            errorBox.classList.add('hidden');
            if (!form.reportValidity()) return;

            submitting = true;
            submitButton.disabled = true;
            submitLabel.textContent = 'Signing in...';
            spinner.classList.remove('hidden');
            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    credentials: 'same-origin',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: emailInput.value.trim(),
                        password: passwordInput.value
                    })
                });
                const result = await response.json().catch(() => ({}));
                if (response.status === 401) {
                    showError('Invalid email or password. Please try again.');
                    return;
                }
                if (!response.ok) {
                    showError(response.status >= 500
                        ? 'Unable to sign in right now. Please try again later.'
                        : (result.error || 'Unable to sign in. Check your details and try again.'));
                    return;
                }

                const sessionResponse = await fetch('/api/auth/session', {
                    credentials: 'same-origin',
                    cache: 'no-store'
                });
                const session = await sessionResponse.json().catch(() => ({}));
                if (!sessionResponse.ok || !session.authenticated) {
                    showError('Sign-in could not be verified. Please try again.');
                    return;
                }
                window.location.replace(loginDestination());
            } catch {
                showError('Unable to connect to the server. Please check your connection and try again.');
            } finally {
                submitting = false;
                submitButton.disabled = false;
                submitLabel.textContent = 'Sign In';
                spinner.classList.add('hidden');
            }
        });

        verifyExistingSession();
    </script>
</body>
</html>
